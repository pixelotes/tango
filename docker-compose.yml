services:
  tango:
    build: .
    image: pixelotes/tango:latest
    container_name: tango
    restart: unless-stopped
    ports:
      - "7246:7246"
      - "6881:6881"
      - "6881:6881/udp"
    volumes:
      - ./config.docker.yaml:/tango/config.yaml:ro
      - session:/tango/session
      - ./downloads:/tango/data
    environment:
      - TZ=Europe/Madrid

volumes:
  session:
